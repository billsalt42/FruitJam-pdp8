# PDP-8/E emulator settings (Adafruit Fruit Jam)
# system to boot at power-up: os8, tss8 (DEC TSS/8.24), uwm (UWM TSS/8.25), multos or etos
system=os8
# RK05 cartridge images for OS/8 (root of the card, SIMH format)
rk0=os8.rk05
rk1=blank.rk05
rk2=ock.rk05
rk3=
# TC08 DECtape images on DTA0-DTA3 (SIMH .tu56 format; os8.tu56 is a bootable OS/8 V3F tape)
dt0=os8.tu56
dt1=blank.tu56
dt2=
dt3=
# RX01 floppy images on RXA0-RXA1 (.rx01; an .rx02 image switches to the RX28 controller)
rx0=blank.rx01
rx1=
# OS/8 boots from rk (RK0), dectape (DTA0) or floppy (RXA0)
os8_boot=rk
# TSS/8: INIT paper tape (BIN format) and RF08 fixed-head disk image
tss8_bin=tss8_init.bin
tss8_rf=tss8_rf.dsk
# UWM TSS/8.25: INIT tape and RF08 disk image
uwm_bin=uwm_init.bin
uwm_rf=uwm_rf.dsk
# MULTOS/8 time-sharing OS/8 (pack not included: multos8.rk05 from pdp8online.com)
multos_rk=multos8.rk05
multos_lines=1
# ETOS (pack not included: etosv5b-demo.rk05 from pdp8online.com)
etos_rk=etosv5b-demo.rk05
etos_lines=1
# green, amber, white or blue
color=green
# fold keyboard input to upper case (Caps Lock also toggles it)
uppercase=on
# full = as fast as possible, real = about the speed of a real PDP-8/E
speed=full
# seconds before booting automatically (-1 = wait for Enter)
autoboot=3
# WiFi + SSH (TSS/8 terminals over the network).  Leave wifi_ssid empty to
# keep WiFi off.  SSH stays off until ssh_password is set.  No '#' in values.
wifi_ssid=
wifi_password=
ssh_password=
ssh_port=22
hostname=pdp8
